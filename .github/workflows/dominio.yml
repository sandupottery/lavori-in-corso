# Collega sandupottery.com e www al progetto Pages.
#
# Esiste come workflow separato e manuale perché va eseguito UNA VOLTA, dopo
# che i nameserver puntano a Cloudflare: prima di allora la zona non è attiva
# e Cloudflare rifiuta il dominio. Usa lo stesso token del deploy, che ha già
# i permessi su Pages — così non serve un secondo token in giro.
#
# È idempotente: se il dominio è già collegato l'API risponde con un errore
# che viene ignorato.

name: Collega il dominio

on:
    workflow_dispatch:

jobs:
    dominio:
        runs-on: ubuntu-latest
        steps:
            - name: Collega i domini al progetto Pages
              env:
                  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -u
                  PROGETTO=sandupottery-lavori-in-corso
                  for DOMINIO in sandupottery.com www.sandupottery.com; do
                    echo "── $DOMINIO"
                    RISPOSTA=$(curl -sS -X POST \
                      "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROGETTO/domains" \
                      -H "Authorization: Bearer $CF_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data "{\"name\":\"$DOMINIO\"}")
                    echo "$RISPOSTA" | python3 -c "
                  import sys, json
                  d = json.load(sys.stdin)
                  if d.get('success'):
                      r = d.get('result') or {}
                      print('   collegato:', r.get('name'), '- stato:', r.get('status'))
                  else:
                      messaggi = [e.get('message','') for e in d.get('errors', [])]
                      # 8000013 = il dominio è già collegato: va bene così
                      if any('already' in m.lower() or '8000013' in str(e.get('code','')) for m, e in zip(messaggi, d.get('errors', []))):
                          print('   già collegato, niente da fare')
                      else:
                          print('   ERRORE:', messaggi); sys.exit(1)
                  "
                  done

            - name: Elenca i domini del progetto
              env:
                  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/sandupottery-lavori-in-corso/domains" \
                    -H "Authorization: Bearer $CF_TOKEN" \
                  | python3 -c "
                  import sys, json
                  d = json.load(sys.stdin)
                  for x in d.get('result', []):
                      print(f\"  {x.get('name'):<28} {x.get('status')}\")
                  "
