name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    release:
        needs: ci
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            # No `release-type` input here: passing one selects bootstrap mode
            # and makes the action ignore `release-please-config.json` /
            # `.release-please-manifest.json` in this repo — including the
            # custom `changelog-sections` and `bump-minor-pre-major` settings.
            # Omitting it lets the action read those config files by their
            # default names instead. Check the first release run after this
            # change to confirm the config is actually picked up.
            # `target-branch` is explicit on purpose. Without it the action
            # takes its target from the repository's DEFAULT branch, which is a
            # GitHub setting rather than anything visible in this file — the
            # first run of this workflow tried to release `dev` because the repo
            # had been created from that branch. Naming it here means the
            # release always follows `main`, whatever the repo setting says.
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  target-branch: main

    deploy:
        needs: [ci, release]
        if: needs.release.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: static-site
                  path: out/
            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy out --project-name=sandupottery-lavori-in-corso
